<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>철강업 세무동향 모니터</title>
  <link rel="icon" href="data:,">
  <!-- 외부 리소스는 이 글꼴 하나뿐. 오프라인이면 맑은 고딕 등 시스템 글꼴로 대체된다 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 화면이 그려지기 전에 저장된 테마를 적용해 깜빡임을 막는다
    try {
      var t = (JSON.parse(localStorage.getItem('stm.settings') || '{}') || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>철강업 세무동향 모니터</h1>
      <p class="last-fetched" id="last-fetched">마지막 수집: -</p>
    </div>
    <nav class="header-actions" aria-label="주요 기능">
      <button type="button" id="btn-collect" class="btn-primary">최근 1주일 수집</button>
      <button type="button" id="btn-paste">붙여넣기 등록</button>
      <button type="button" id="btn-add">+ 직접 추가</button>
      <button type="button" id="btn-export">내보내기</button>
      <button type="button" id="btn-settings" aria-pressed="false">설정</button>
      <button type="button" id="btn-theme" aria-label="다크 모드로 전환" title="다크 모드로 전환">☾</button>
    </nav>
  </header>

  <div id="banner-root"></div>
  <main id="main" class="app-main"></main>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <noscript>이 앱을 사용하려면 JavaScript를 켜 주세요.</noscript>

  <!-- file:// 더블클릭 실행을 위해 ES 모듈 대신 일반 스크립트를 순서대로 로드한다 -->
  <script src="js/utils.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/db.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/collector.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/ui/list.js"></script>
  <script src="js/ui/detail.js"></script>
  <script src="js/ui/form.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/ui/importPreview.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
